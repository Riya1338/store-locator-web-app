<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Locator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>Store Locator</h1>
            <p>Find a store near you.</p>
        </div>
    </header>

    <main class="container">
        <section class="search-card" aria-labelledby="search-title">
            <h2 id="search-title">Find a store</h2>

            <form id="searchForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="location">City or postcode</label>
                        <input
                            id="location"
                            name="location"
                            type="text"
                            placeholder="e.g. Christchurch"
                            autocomplete="off"
                        >
                    </div>

                    <div class="form-group">
                        <label for="type">Store type</label>
                        <select id="type" name="type">
                            <option value="">All stores</option>
                            <option value="Grocery">Grocery</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Pharmacy">Pharmacy</option>
                            <option value="Clothing">Clothing</option>
                        </select>
                    </div>

                    <button type="submit">Search</button>
                </div>
            </form>
        </section>

        <section aria-labelledby="results-title">
            <div class="results-heading">
                <h2 id="results-title">Stores</h2>
                <span id="resultCount" aria-live="polite"></span>
            </div>

            <div id="status" class="status" aria-live="polite"></div>
            <div id="storeResults" class="store-grid"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Store Locator — Independent portfolio project</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
